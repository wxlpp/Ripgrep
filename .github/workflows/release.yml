name: Release

# Manual: builds and tests the XCFramework, points Package.swift at the new
# release, then commits, tags and publishes. The tagged commit therefore always
# carries the checksum of the uploaded zip.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (no v prefix)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"; exit 1
          fi

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios \
                            aarch64-apple-darwin x86_64-apple-darwin

      - name: Check generated bindings are up to date
        run: |
          bash scripts/generate-bindings.sh
          git diff --exit-code -- Sources/OhMyGrepFFI

      - name: Rust tests
        run: cargo test -p ohmygrep_core

      - name: Build and package XCFramework
        run: bash scripts/package-release.sh

      - name: Swift tests
        run: swift test

      - name: Point Package.swift at the release
        run: bash scripts/set-release.sh "$VERSION" "$(cat dist/OhMyGrepCore.xcframework.zip.sha256)"

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "refs/tags/$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            dist/OhMyGrepCore.xcframework.zip \
            dist/OhMyGrepCore.xcframework.zip.sha256 \
            --title "$VERSION" --generate-notes

      - name: Verify a consumer can resolve the release
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/Sources/Consumer"
          cat > "$consumer/Package.swift" <<EOF
          // swift-tools-version:6.0
          import PackageDescription
          let package = Package(
              name: "Consumer",
              platforms: [.macOS(.v13)],
              dependencies: [.package(url: "https://github.com/${GITHUB_REPOSITORY}", exact: "$VERSION")],
              targets: [.target(name: "Consumer", dependencies: [.product(name: "OhMyGrep", package: "oh-my-grep")])]
          )
          EOF
          echo 'import OhMyGrep' > "$consumer/Sources/Consumer/Consumer.swift"
          swift build --package-path "$consumer"
