[workspace]
resolver = "2"
members = ["crates/*"]
# fuzz/ is its own workspace (cargo-fuzz needs nightly).
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[profile.release]
# Unwinding stays on: panics are caught and returned as InternalPanic.
lto = true
codegen-units = 1
