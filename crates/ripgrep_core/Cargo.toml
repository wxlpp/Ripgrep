[package]
name = "ripgrep_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ripgrep_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ignore = "0.4.23"
grep-regex = "0.1.13"
grep-searcher = "0.1.14"
grep-matcher = "0.1.7"
globset = "0.4.15"
crossbeam-channel = "0.5.13"
thiserror = "2.0"
once_cell = "1.20"
uniffi = { version = "0.28" }
